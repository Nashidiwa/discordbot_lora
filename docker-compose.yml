services:
  lora-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lora-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persistent storage for SQLite database (preserves data across rebuilds)
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
